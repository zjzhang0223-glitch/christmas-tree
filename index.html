<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas — Interactive 3D & Computer Vision Experience</title>
    <!-- Google Fonts: Cinzel & Times New Roman fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #000000;
            --xmas-green: #20F856;
            --champagne-gold: #d4af37;
            --cream-white: #fceea7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-black);
            font-family: 'Times New Roman', Times, serif;
            color: var(--cream-white);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Loader Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background-color: var(--bg-black);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), visibility 1.2s;
        }

        #loader.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-top: 1px solid var(--champagne-gold);
            animation: spin 1s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 5px;
            color: var(--champagne-gold);
        }

        /* UI Layer */
        #ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 36px 24px 36px;
            transition: opacity 0.6s ease;
        }

        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 4px;
            text-align: center;
            background: linear-gradient(180deg, #ffffff 0%, var(--cream-white) 45%, var(--champagne-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.55));
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
                letter-spacing: 2px;
            }
        }

        .controls-dock {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        /* Upload & Music Controls Wrapper */
        .upload-wrapper {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: opacity 0.6s ease;
        }

        .glass-btn {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--cream-white);
            background: rgba(20, 20, 20, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--champagne-gold);
            padding: 14px 32px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15), inset 0 0 12px rgba(212, 175, 55, 0.08);
        }

        .glass-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            color: #ffffff;
            box-shadow: 0 0 28px rgba(212, 175, 55, 0.45), inset 0 0 16px rgba(212, 175, 55, 0.2);
            transform: translateY(-1px);
        }

        .glass-btn:active {
            transform: translateY(1px);
        }

        .hint-text {
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            font-style: italic;
            letter-spacing: 1px;
            color: rgba(252, 238, 167, 0.75);
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .music-now-playing {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--cream-white);
            opacity: 0.85;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .gesture-status {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--xmas-green);
            opacity: 0.85;
            margin-top: 2px;
            text-transform: uppercase;
        }

        #file-input, #music-file-input {
            display: none;
        }

        /* Invisible Webcam Container for CV Inference */
        #webcam-container {
            position: fixed;
            bottom: 12px;
            right: 12px;
            width: 160px;
            height: 120px;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        #webcam, #cv-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 160px;
            height: 120px;
        }
    </style>

    <!-- Main Application Module -->
    <script type="module">
        import * as THREE from 'three';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // ==========================================
        // GLOBAL STATE MACHINE
        // ==========================================
        const MODES = {
            TREE: 'TREE',
            SCATTER: 'SCATTER',
            FOCUS: 'FOCUS'
        };

        const STATE = {
            mode: MODES.TREE,
            targetPhoto: null,
            handDetected: false,
            handRotation: { x: 0, y: 0 },
            autoSpinAngle: 0,
            lastGestureTime: 0
        };

        // ==========================================
        // HOLIDAY MUSIC CONTROLLER (DEFAULT LOOPING "Merry Christmas" 3)
        // ==========================================
        class HolidayMusicController {
            constructor(statusEl) {
                this.statusEl = statusEl;
                this.audioCtx = null;
                this.masterGain = null;
                this.isPlaying = false;
                this.shouldAutoPlay = false;
                this.schedulerTimer = null;
                this.nextNoteTime = 0;
                this.noteIndex = 0;
                this.trackIndex = 0;
                this.currentTrackTitle = 'Merry Christmas 3';

                // Default playlist starting with "Merry Christmas" 3
                this.tracks = [
                    {
                        title: 'Merry Christmas 3',
                        tempo: 136,
                        notes: [
                            // Festive variation 3 ("We Wish You a Merry Christmas" arrangement)
                            [392.00, 1], [523.25, 1], [523.25, 0.5], [587.33, 0.5], [523.25, 0.5], [493.88, 0.5],
                            [440.00, 1], [440.00, 1], [440.00, 1],
                            [587.33, 1], [587.33, 0.5], [659.25, 0.5], [587.33, 0.5], [523.25, 0.5],
                            [493.88, 1], [392.00, 1], [392.00, 1],
                            [659.25, 1], [659.25, 0.5], [698.46, 0.5], [659.25, 0.5], [587.33, 0.5],
                            [523.25, 1], [440.00, 1], [392.00, 0.5], [392.00, 0.5],
                            [440.00, 1], [587.33, 1], [493.88, 1],
                            [523.25, 2], [0, 1]
                        ]
                    },
                    {
                        title: 'Jingle Bells',
                        tempo: 144,
                        notes: [
                            [659.25, 0.75], [659.25, 0.75], [659.25, 1.5],
                            [659.25, 0.75], [659.25, 0.75], [659.25, 1.5],
                            [659.25, 0.75], [783.99, 0.75], [523.25, 1.0], [587.33, 0.5],
                            [659.25, 3.0],
                            [698.46, 0.75], [698.46, 0.75], [698.46, 1.0], [698.46, 0.5],
                            [698.46, 0.75], [659.25, 0.75], [659.25, 0.75], [659.25, 0.75],
                            [659.25, 0.75], [587.33, 0.75], [587.33, 0.75], [659.25, 0.75],
                            [587.33, 1.5], [783.99, 1.5], [0, 0.5]
                        ]
                    },
                    {
                        title: 'Silent Night',
                        tempo: 88,
                        notes: [
                            [392.00, 1.5], [440.00, 0.5], [392.00, 1.0],
                            [329.63, 3.0],
                            [392.00, 1.5], [440.00, 0.5], [392.00, 1.0],
                            [329.63, 3.0],
                            [587.33, 2.0], [587.33, 1.0],
                            [493.88, 3.0],
                            [523.25, 2.0], [523.25, 1.0],
                            [392.00, 3.0], [0, 1.0]
                        ]
                    }
                ];

                this.customAudio = new Audio();
                this.customAudio.loop = true;
                this.isCustomTrack = false;
            }

            ensureAudioContext() {
                if (!this.audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    this.audioCtx = new AudioContextClass();
                    this.masterGain = this.audioCtx.createGain();
                    this.masterGain.gain.value = 0.22;
                    this.masterGain.connect(this.audioCtx.destination);
                }
                if (this.audioCtx.state === 'suspended') {
                    return this.audioCtx.resume();
                }
                return Promise.resolve();
            }

            playChime(freq, duration, startTime) {
                if (!this.audioCtx || !this.masterGain || freq <= 0) return;

                const osc = this.audioCtx.createOscillator();
                const harmonic = this.audioCtx.createOscillator();
                const noteGain = this.audioCtx.createGain();
                const harmonicGain = this.audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, startTime);

                harmonic.type = 'triangle';
                harmonic.frequency.setValueAtTime(freq * 2, startTime);

                harmonicGain.gain.setValueAtTime(0.16, startTime);
                harmonicGain.gain.exponentialRampToValueAtTime(0.001, startTime + Math.min(duration * 0.65, 0.35));

                noteGain.gain.setValueAtTime(0.001, startTime);
                noteGain.gain.linearRampToValueAtTime(0.65, startTime + 0.015);
                noteGain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration * 1.15);

                osc.connect(noteGain);
                harmonic.connect(harmonicGain);
                harmonicGain.connect(noteGain);
                noteGain.connect(this.masterGain);

                osc.start(startTime);
                harmonic.start(startTime);
                osc.stop(startTime + duration * 1.2 + 0.05);
                harmonic.stop(startTime + duration * 1.2 + 0.05);
            }

            scheduler = () => {
                if (!this.isPlaying || this.isCustomTrack || !this.audioCtx) return;

                const track = this.tracks[this.trackIndex];
                const secondsPerBeat = 60.0 / track.tempo;
                const lookahead = 0.15;

                while (this.nextNoteTime < this.audioCtx.currentTime + lookahead) {
                    const [freq, beats] = track.notes[this.noteIndex];
                    const dur = beats * secondsPerBeat;
                    this.playChime(freq, dur, this.nextNoteTime);

                    this.nextNoteTime += dur;
                    this.noteIndex = (this.noteIndex + 1) % track.notes.length;
                }
            };

            updateStatusLabel() {
                if (!this.statusEl) return;
                const stateTag = this.isPlaying ? 'PLAYING' : 'READY';
                this.statusEl.textContent = `MUSIC (${stateTag} • LOOP): ${this.currentTrackTitle.toUpperCase()}`;
            }

            async start() {
                this.shouldAutoPlay = true;

                if (this.isCustomTrack) {
                    this.customAudio.loop = true;
                    try {
                        await this.customAudio.play();
                        this.isPlaying = true;
                    } catch (_) {
                        this.isPlaying = false;
                    }
                    this.updateStatusLabel();
                    return;
                }

                try {
                    await this.ensureAudioContext();
                    if (this.audioCtx && this.audioCtx.state === 'running') {
                        this.isPlaying = true;
                        this.nextNoteTime = this.audioCtx.currentTime + 0.05;
                        clearInterval(this.schedulerTimer);
                        this.schedulerTimer = setInterval(this.scheduler, 50);
                    } else {
                        this.isPlaying = false;
                    }
                } catch (_) {
                    this.isPlaying = false;
                }
                this.updateStatusLabel();
            }

            async cycleTrack() {
                this.isCustomTrack = false;
                this.customAudio.pause();
                this.trackIndex = (this.trackIndex + 1) % this.tracks.length;
                this.currentTrackTitle = this.tracks[this.trackIndex].title;
                this.noteIndex = 0;
                await this.start();
            }

            async setCustomFile(file) {
                if (!file) return;
                clearInterval(this.schedulerTimer);
                this.isCustomTrack = true;
                const url = URL.createObjectURL(file);
                this.customAudio.src = url;
                this.customAudio.loop = true;
                this.currentTrackTitle = file.name.replace(/\.[^/.]+$/, '') || 'Custom Music';
                await this.start();
            }

            async resumeIfNeeded() {
                if (this.shouldAutoPlay && !this.isPlaying) {
                    await this.start();
                }
            }
        }

        // ==========================================
        // PROCEDURAL TEXTURE GENERATORS
        // ==========================================
        function createCandyCaneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Crisp White Base
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 256, 256);

            // Diagonal Crimson Red Stripes
            ctx.fillStyle = '#c8102e';
            const stripeWidth = 32;
            for (let i = -256; i < 512; i += stripeWidth * 2) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + stripeWidth, 0);
                ctx.lineTo(i + stripeWidth - 256, 256);
                ctx.lineTo(i - 256, 256);
                ctx.closePath();
                ctx.fill();
            }

            // Subtle gold pinstripe accent
            ctx.fillStyle = '#d4af37';
            for (let i = -256; i < 512; i += stripeWidth * 2) {
                ctx.beginPath();
                ctx.moveTo(i + stripeWidth, 0);
                ctx.lineTo(i + stripeWidth + 4, 0);
                ctx.lineTo(i + stripeWidth + 4 - 256, 256);
                ctx.lineTo(i + stripeWidth - 256, 256);
                ctx.closePath();
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(2, 8);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function createDefaultJoyeuxNoelTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Deep emerald & obsidian luxury card backdrop
            const grad = ctx.createRadialGradient(256, 256, 30, 256, 256, 340);
            grad.addColorStop(0, '#0f2b1d');
            grad.addColorStop(1, '#040a07');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);

            // Ornamental Gold Double Border
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 8;
            ctx.strokeRect(24, 24, 464, 464);

            ctx.strokeStyle = '#fceea7';
            ctx.lineWidth = 2;
            ctx.strokeRect(36, 36, 440, 440);

            // Decorative Star Emblem
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            const cx = 256, cy = 155, spikes = 8, outerR = 26, innerR = 8;
            for (let i = 0; i < spikes * 2; i++) {
                const r = i % 2 === 0 ? outerR : innerR;
                const angle = (i * Math.PI) / spikes;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();

            // Typography: JOYEUX NOEL
            ctx.fillStyle = '#fceea7';
            ctx.font = 'bold 46px "Cinzel", "Times New Roman", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('JOYEUX NOEL', 256, 256);

            // Subtitle flourish
            ctx.fillStyle = '#d4af37';
            ctx.font = 'italic 22px "Times New Roman", serif';
            ctx.fillText('~ Season of Light & Wonder ~', 256, 315);

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        // ==========================================
        // PARTICLE & ORNAMENT ENTITY CLASS
        // ==========================================
        class HolidayParticle {
            constructor(mesh, type, index, total) {
                this.mesh = mesh;
                this.type = type; // 'ORNAMENT' | 'CANDY' | 'PHOTO'
                this.index = index;
                this.total = total;

                // Normalized height factor [0, 1]
                this.t = index / Math.max(1, total);

                // Compute TREE Mode Target (Spiral Cone)
                this.treePos = new THREE.Vector3();
                this.treeRot = new THREE.Euler();
                this.computeTreeTransform();

                // Compute SCATTER Mode Target (Spherical shell radius 8~20)
                this.scatterPos = new THREE.Vector3();
                this.computeScatterTransform();

                // Random self-rotation velocity vector for SCATTER mode
                this.rotVelocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.04,
                    (Math.random() - 0.5) * 0.04,
                    (Math.random() - 0.5) * 0.04
                );

                // Base scale
                this.baseScale = mesh.scale.clone();
                this.currentScale = this.baseScale.clone();

                // Initialize at tree position with slight organic offset
                this.mesh.position.copy(this.treePos);
                this.mesh.rotation.copy(this.treeRot);
            }

            computeTreeTransform() {
                const treeHeight = 28;
                const maxRadius = 11.5;
                const tVal = this.type === 'PHOTO' ? (0.15 + ((this.index * 0.61803398875) % 0.7)) : this.t;
                
                const radius = maxRadius * (1 - tVal) + (this.type === 'PHOTO' ? 0.9 : (Math.random() - 0.5) * 0.8);
                const angle = tVal * 50 * Math.PI + (this.type === 'PHOTO' ? this.index * 2.4 : (Math.random() - 0.5) * 0.35);

                const y = (tVal * treeHeight) - (treeHeight * 0.46);
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;

                this.treePos.set(x, y, z);

                if (this.type === 'PHOTO') {
                    const lookAngle = Math.atan2(x, z);
                    this.treeRot.set(-0.12, lookAngle, 0);
                } else {
                    this.treeRot.set(
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2
                    );
                }
            }

            computeScatterTransform() {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 8 + Math.random() * 12; // 8 ~ 20

                this.scatterPos.set(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
            }

            update(mode, isTargetPhoto, mainGroup) {
                const lerpFactor = 0.055;

                if (mode === MODES.TREE) {
                    this.mesh.position.lerp(this.treePos, lerpFactor);
                    
                    this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x, this.treeRot.x, lerpFactor);
                    this.mesh.rotation.y = THREE.MathUtils.lerp(this.mesh.rotation.y, this.treeRot.y, lerpFactor);
                    this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z, this.treeRot.z, lerpFactor);

                    this.currentScale.lerp(this.baseScale, lerpFactor);
                    this.mesh.scale.copy(this.currentScale);

                } else if (mode === MODES.SCATTER) {
                    this.mesh.position.lerp(this.scatterPos, lerpFactor);

                    this.mesh.rotation.x += this.rotVelocity.x;
                    this.mesh.rotation.y += this.rotVelocity.y;
                    this.mesh.rotation.z += this.rotVelocity.z;

                    this.currentScale.lerp(this.baseScale, lerpFactor);
                    this.mesh.scale.copy(this.currentScale);

                } else if (mode === MODES.FOCUS) {
                    if (isTargetPhoto) {
                        const worldTarget = new THREE.Vector3(0, 2, 35);
                        const localTarget = mainGroup.worldToLocal(worldTarget.clone());

                        this.mesh.position.lerp(localTarget, 0.08);

                        this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x, -mainGroup.rotation.x, 0.08);
                        this.mesh.rotation.y = THREE.MathUtils.lerp(this.mesh.rotation.y, -mainGroup.rotation.y, 0.08);
                        this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z, 0, 0.08);

                        const focusScale = new THREE.Vector3(4.5, 4.5, 4.5);
                        this.currentScale.lerp(focusScale, 0.08);
                        this.mesh.scale.copy(this.currentScale);
                    } else {
                        this.mesh.position.lerp(this.scatterPos, lerpFactor);
                        this.mesh.rotation.x += this.rotVelocity.x * 0.5;
                        this.mesh.rotation.y += this.rotVelocity.y * 0.5;
                        this.mesh.rotation.z += this.rotVelocity.z * 0.5;

                        this.currentScale.lerp(this.baseScale, lerpFactor);
                        this.mesh.scale.copy(this.currentScale);
                    }
                }
            }
        }

        // ==========================================
        // MAIN CHRISTMAS TREE APPLICATION CLASS
        // ==========================================
        class ChristmasTreeExperience {
            constructor(musicController) {
                this.musicController = musicController;
                this.container = document.getElementById('canvas-container');
                this.particles = [];
                this.photos = [];
                this.dustSystem = null;
                this.starTopper = null;

                this.initScene();
                this.initEnvironmentAndLights();
                this.initPostProcessing();
                this.initContent();
                this.bindEvents();
            }

            initScene() {
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.toneMapping = THREE.ReinhardToneMapping;
                this.renderer.toneMappingExposure = 2.2;
                this.container.appendChild(this.renderer.domElement);

                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x000000);
                this.scene.fog = new THREE.FogExp2(0x000000, 0.011);

                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 250);
                this.camera.position.set(0, 2, 50);
                this.camera.lookAt(0, 1, 0);

                this.mainGroup = new THREE.Group();
                this.scene.add(this.mainGroup);
            }

            initEnvironmentAndLights() {
                const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
                pmremGenerator.compileEquirectangularShader();
                const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
                this.scene.environment = envTexture;
                pmremGenerator.dispose();

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);

                const innerPointLight = new THREE.PointLight(0xff7b00, 2, 35);
                innerPointLight.position.set(0, 2, 0);
                this.mainGroup.add(innerPointLight);

                const goldSpotLight = new THREE.SpotLight(0xd4af37, 1200);
                goldSpotLight.position.set(30, 40, 40);
                goldSpotLight.angle = Math.PI / 4;
                goldSpotLight.penumbra = 0.6;
                goldSpotLight.decay = 2;
                this.scene.add(goldSpotLight);

                const blueSpotLight = new THREE.SpotLight(0x2a6fdb, 600);
                blueSpotLight.position.set(-30, 20, -30);
                blueSpotLight.angle = Math.PI / 3;
                blueSpotLight.penumbra = 0.7;
                blueSpotLight.decay = 2;
                this.scene.add(blueSpotLight);
            }

            initPostProcessing() {
                this.composer = new EffectComposer(this.renderer);

                const renderPass = new RenderPass(this.scene, this.camera);
                this.composer.addPass(renderPass);

                const bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    0.45,
                    0.4,
                    0.7
                );
                this.composer.addPass(bloomPass);
                this.bloomPass = bloomPass;
            }

            initContent() {
                const boxGeo = new THREE.BoxGeometry(0.68, 0.68, 0.68);
                const sphereGeo = new THREE.SphereGeometry(0.42, 24, 24);

                const matGoldBox = new THREE.MeshStandardMaterial({
                    color: 0xd4af37,
                    metalness: 0.88,
                    roughness: 0.18
                });
                const matGreenBox = new THREE.MeshStandardMaterial({
                    color: 0x0b4f26,
                    emissive: 0x041a0c,
                    metalness: 0.65,
                    roughness: 0.25
                });

                const matGoldSphere = new THREE.MeshPhysicalMaterial({
                    color: 0xfceea7,
                    metalness: 0.92,
                    roughness: 0.12,
                    clearcoat: 0.6
                });
                const matRedSphere = new THREE.MeshPhysicalMaterial({
                    color: 0xb80d28,
                    metalness: 0.35,
                    roughness: 0.15,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.08
                });

                const candyCurve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(0, -0.7, 0),
                    new THREE.Vector3(0, 0.35, 0),
                    new THREE.Vector3(0.18, 0.65, 0),
                    new THREE.Vector3(0.45, 0.58, 0),
                    new THREE.Vector3(0.52, 0.32, 0)
                ]);
                const candyGeo = new THREE.TubeGeometry(candyCurve, 24, 0.11, 12, false);
                const candyTexture = createCandyCaneTexture();
                const matCandy = new THREE.MeshStandardMaterial({
                    map: candyTexture,
                    roughness: 0.22,
                    metalness: 0.1
                });

                const totalMainParticles = 1500;
                for (let i = 0; i < totalMainParticles; i++) {
                    const rand = Math.random();
                    let mesh;
                    let type = 'ORNAMENT';

                    if (rand < 0.36) {
                        mesh = new THREE.Mesh(boxGeo, Math.random() > 0.45 ? matGoldBox : matGreenBox);
                    } else if (rand < 0.86) {
                        mesh = new THREE.Mesh(sphereGeo, Math.random() > 0.45 ? matRedSphere : matGoldSphere);
                    } else {
                        mesh = new THREE.Mesh(candyGeo, matCandy);
                        type = 'CANDY';
                    }

                    const scaleJitter = 0.65 + Math.random() * 0.7;
                    mesh.scale.setScalar(scaleJitter);

                    this.mainGroup.add(mesh);
                    const particle = new HolidayParticle(mesh, type, i, totalMainParticles);
                    this.particles.push(particle);
                }

                const starGeo = new THREE.OctahedronGeometry(1.35, 0);
                const starMat = new THREE.MeshStandardMaterial({
                    color: 0xfceea7,
                    emissive: 0xd4af37,
                    emissiveIntensity: 1.8,
                    metalness: 0.9,
                    roughness: 0.1
                });
                this.starTopper = new THREE.Mesh(starGeo, starMat);
                this.starTopper.position.set(0, 15.8, 0);
                this.mainGroup.add(this.starTopper);

                const defaultPhotoTexture = createDefaultJoyeuxNoelTexture();
                this.addPhotoToScene(defaultPhotoTexture);

                this.createDustParticles(2500);
            }

            createDustParticles(count) {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);

                const palette = [
                    new THREE.Color(0xd4af37),
                    new THREE.Color(0xfceea7),
                    new THREE.Color(0x20F856)
                ];

                for (let i = 0; i < count; i++) {
                    const r = 6 + Math.random() * 34;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);

                    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                    positions[i * 3 + 2] = r * Math.cos(phi);

                    const c = palette[Math.floor(Math.random() * palette.length)];
                    colors[i * 3] = c.r;
                    colors[i * 3 + 1] = c.g;
                    colors[i * 3 + 2] = c.b;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: 0.18,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.75,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.dustSystem = new THREE.Points(geometry, material);
                this.mainGroup.add(this.dustSystem);
            }

            addPhotoToScene(texture) {
                const img = texture.image;
                let width = 2.0;
                let height = 2.0;
                if (img && img.width && img.height) {
                    const aspect = img.width / img.height;
                    if (aspect >= 1) {
                        width = 2.2;
                        height = 2.2 / aspect;
                    } else {
                        height = 2.2;
                        width = 2.2 * aspect;
                    }
                }

                const frameThickness = 0.16;
                const frameDepth = 0.12;
                const frameGeo = new THREE.BoxGeometry(width + frameThickness * 2, height + frameThickness * 2, frameDepth);
                const frameMat = new THREE.MeshStandardMaterial({
                    color: 0xd4af37,
                    metalness: 0.9,
                    roughness: 0.18
                });
                const frameMesh = new THREE.Mesh(frameGeo, frameMat);

                const photoGeo = new THREE.PlaneGeometry(width, height);
                const photoMat = new THREE.MeshBasicMaterial({
                    map: texture,
                    side: THREE.DoubleSide
                });
                const photoPlane = new THREE.Mesh(photoGeo, photoMat);
                photoPlane.position.z = frameDepth / 2 + 0.01;
                frameMesh.add(photoPlane);

                const backPlane = photoPlane.clone();
                backPlane.position.z = -(frameDepth / 2 + 0.01);
                backPlane.rotation.y = Math.PI;
                frameMesh.add(backPlane);

                this.mainGroup.add(frameMesh);

                const photoIndex = this.photos.length;
                const particle = new HolidayParticle(frameMesh, 'PHOTO', photoIndex, Math.max(8, photoIndex + 1));
                this.particles.push(particle);
                this.photos.push(particle);

                this.photos.forEach((p, idx) => {
                    p.index = idx;
                    p.total = this.photos.length;
                    p.computeTreeTransform();
                });

                if (STATE.mode === MODES.FOCUS) {
                    STATE.targetPhoto = particle;
                }
            }

            triggerModeChange(newMode) {
                if (STATE.mode === newMode && newMode !== MODES.FOCUS) return;
                
                STATE.mode = newMode;
                const indicator = document.getElementById('mode-indicator');
                if (indicator) {
                    indicator.textContent = `MODE: ${newMode} • FIST: TREE | OPEN: SCATTER | PINCH: FOCUS`;
                }

                if (newMode === MODES.FOCUS && this.photos.length > 0) {
                    const randomIdx = Math.floor(Math.random() * this.photos.length);
                    STATE.targetPhoto = this.photos[randomIdx];
                } else {
                    STATE.targetPhoto = null;
                }
            }

            bindEvents() {
                const unlockAudio = () => {
                    if (this.musicController) {
                        this.musicController.resumeIfNeeded();
                    }
                };
                window.addEventListener('pointerdown', unlockAudio, { passive: true });
                window.addEventListener('keydown', unlockAudio, { passive: true });

                // Resize Handler
                window.addEventListener('resize', () => {
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    this.camera.aspect = w / h;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(w, h);
                    this.composer.setSize(w, h);
                    this.bloomPass.resolution.set(w, h);
                });

                // Keyboard 'H' Toggle for Controls
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'h' || e.key === 'H') {
                        const controls = document.getElementById('controls-wrapper');
                        if (controls) {
                            controls.classList.toggle('ui-hidden');
                        }
                    }
                    if (e.key === '1') this.triggerModeChange(MODES.TREE);
                    if (e.key === '2') this.triggerModeChange(MODES.SCATTER);
                    if (e.key === '3') this.triggerModeChange(MODES.FOCUS);
                });

                // File Upload Logic (Exact Specification)
                const uploadBtn = document.getElementById('upload-btn');
                const fileInput = document.getElementById('file-input');

                uploadBtn.addEventListener('click', () => {
                    fileInput.click();
                });

                const addPhotoToScene = (texture) => this.addPhotoToScene(texture);

                fileInput.addEventListener('change', (e) => {
                    const files = e.target.files;
                    if (!files || !files.length) return;

                    for (const f of files) {
                        const reader = new FileReader();
                        // 监听 input change 事件
                        reader.onload = (ev) => {
                            new THREE.TextureLoader().load(ev.target.result, (t) => {
                                t.colorSpace = THREE.SRGBColorSpace; // 关键：指定色彩空间
                                addPhotoToScene(t);
                            });
                        };
                        reader.readAsDataURL(f);
                    }
                    fileInput.value = '';
                });

                // CHANGE MUSIC button: cycle built-in looping tracks (defaulting to "Merry Christmas" 3) or pick a local audio file on right-click
                const changeMusicBtn = document.getElementById('change-music-btn');
                const musicFileInput = document.getElementById('music-file-input');

                changeMusicBtn.addEventListener('click', async () => {
                    if (this.musicController) {
                        await this.musicController.cycleTrack();
                    }
                });

                changeMusicBtn.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    musicFileInput.click();
                });

                musicFileInput.addEventListener('change', async (e) => {
                    const file = e.target.files && e.target.files[0];
                    if (file && this.musicController) {
                        await this.musicController.setCustomFile(file);
                    }
                    musicFileInput.value = '';
                });
            }

            animate = () => {
                requestAnimationFrame(this.animate);

                const time = performance.now() * 0.001;

                if (this.starTopper) {
                    this.starTopper.rotation.y = time * 0.8;
                    const starScale = STATE.mode === MODES.TREE ? 1 + Math.sin(time * 3) * 0.08 : 0.01;
                    this.starTopper.scale.lerp(new THREE.Vector3(starScale, starScale, starScale), 0.08);
                }

                if (this.dustSystem) {
                    this.dustSystem.rotation.y = time * 0.03;
                }

                if (STATE.handDetected) {
                    this.mainGroup.rotation.y = THREE.MathUtils.lerp(
                        this.mainGroup.rotation.y,
                        STATE.handRotation.y,
                        0.08
                    );
                    this.mainGroup.rotation.x = THREE.MathUtils.lerp(
                        this.mainGroup.rotation.x,
                        STATE.handRotation.x,
                        0.08
                    );
                } else {
                    if (STATE.mode !== MODES.FOCUS) {
                        STATE.autoSpinAngle += 0.003;
                    }
                    this.mainGroup.rotation.y = THREE.MathUtils.lerp(
                        this.mainGroup.rotation.y,
                        STATE.autoSpinAngle,
                        0.04
                    );
                    this.mainGroup.rotation.x = THREE.MathUtils.lerp(this.mainGroup.rotation.x, 0, 0.04);
                }

                for (let i = 0; i < this.particles.length; i++) {
                    const p = this.particles[i];
                    const isTarget = (STATE.mode === MODES.FOCUS && p === STATE.targetPhoto);
                    p.update(STATE.mode, isTarget, this.mainGroup);
                }

                this.composer.render();
            };
        }

        // ==========================================
        // MEDIAPIPE COMPUTER VISION CONTROLLER
        // ==========================================
        class HandGestureController {
            constructor(appInstance) {
                this.app = appInstance;
                this.video = document.getElementById('webcam');
                this.canvas = document.getElementById('cv-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.handLandmarker = null;
                this.lastVideoTime = -1;
            }

            async init() {
                try {
                    const vision = await FilesetResolver.forVisionTasks(
                        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
                    );

                    this.handLandmarker = await HandLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                            delegate: 'GPU'
                        },
                        runningMode: 'VIDEO',
                        numHands: 1
                    });

                    await this.setupWebcam();
                    this.detectLoop();
                } catch (err) {
                    console.warn('MediaPipe HandLandmarker initialization skipped or unavailable:', err);
                }
            }

            async setupWebcam() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 160, height: 120, facingMode: 'user' },
                    audio: false
                });
                this.video.srcObject = stream;
                await new Promise((resolve) => {
                    this.video.onloadedmetadata = () => {
                        this.video.play();
                        resolve();
                    };
                });
            }

            processGestures(landmarks) {
                const wrist = landmarks[0];
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const palmCenter = landmarks[9];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                const pinkyTip = landmarks[20];

                const normX = (0.5 - palmCenter.x) * 2;
                const normY = (palmCenter.y - 0.5) * 2;
                STATE.handRotation.y = normX * Math.PI * 0.85;
                STATE.handRotation.x = normY * 0.45;

                const pinchDist = Math.hypot(
                    thumbTip.x - indexTip.x,
                    thumbTip.y - indexTip.y
                );

                const dIndex = Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y);
                const dMiddle = Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y);
                const dRing = Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y);
                const dPinky = Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y);
                const avgFingertipDist = (dIndex + dMiddle + dRing + dPinky) / 4;

                const now = performance.now();

                if (pinchDist < 0.05) {
                    if (STATE.mode !== MODES.FOCUS || now - STATE.lastGestureTime > 1200) {
                        STATE.lastGestureTime = now;
                        this.app.triggerModeChange(MODES.FOCUS);
                    }
                } else if (avgFingertipDist < 0.25) {
                    this.app.triggerModeChange(MODES.TREE);
                } else if (avgFingertipDist > 0.4) {
                    this.app.triggerModeChange(MODES.SCATTER);
                }
            }

            detectLoop = () => {
                if (this.handLandmarker && this.video.readyState >= 2) {
                    if (this.video.currentTime !== this.lastVideoTime) {
                        this.lastVideoTime = this.video.currentTime;
                        this.ctx.drawImage(this.video, 0, 0, 160, 120);

                        const results = this.handLandmarker.detectForVideo(this.video, performance.now());
                        if (results.landmarks && results.landmarks.length > 0) {
                            STATE.handDetected = true;
                            this.processGestures(results.landmarks[0]);
                        } else {
                            STATE.handDetected = false;
                        }
                    }
                }
                requestAnimationFrame(this.detectLoop);
            };
        }

        // ==========================================
        // ASYNC BOOTSTRAP & LOADER FADE-OUT
        // ==========================================
        async function bootstrap() {
            const musicStatusEl = document.getElementById('music-status');
            const musicController = new HolidayMusicController(musicStatusEl);

            const app = new ChristmasTreeExperience(musicController);
            app.animate();

            const gestureController = new HandGestureController(app);
            gestureController.init();

            await new Promise((resolve) => setTimeout(resolve, 650));
            const loader = document.getElementById('loader');
            if (loader) {
                loader.classList.add('fade-out');
            }

            // Auto-play default looping "Merry Christmas" 3 track once loading finishes
            await musicController.start();
        }

        bootstrap();
    </script>
